name: Release

# Se dispara solo cuando publicas una etiqueta tipo v0.7.0
on:
  push:
    tags:
      - "v*"

# Necesario para que el workflow pueda crear el release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la version desde la etiqueta
        id: v
        run: |
          TAG="$GITHUB_REF_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Una etiqueta que no sea vX.Y.Z (por ejemplo v0.7.0-rc1) se publica
          # como prerelease, y eso cambia tambien a donde apunta el manifest.
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Etiqueta: $TAG -> version ${TAG#v}"

      - name: Validar que las fuentes no esten rotas
        run: |
          node --check scripts/main.js
          echo "JS OK    scripts/main.js"
          for f in module.json lang/en.json lang/es.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "JSON OK  $f"
          done

      - name: Avisar si en.json y es.json se desincronizaron
        run: |
          node -e "
            const fs = require('fs');
            const load = (p) => Object.keys(JSON.parse(fs.readFileSync(p, 'utf8'))).sort();
            const en = load('lang/en.json');
            const es = load('lang/es.json');
            const faltan = en.filter((k) => !es.includes(k));
            const sobran = es.filter((k) => !en.includes(k));
            if (faltan.length) console.log('::warning::Claves sin traducir al espanol: ' + faltan.join(', '));
            if (sobran.length) console.log('::warning::Claves que sobran en es.json: ' + sobran.join(', '));
            if (!faltan.length && !sobran.length) console.log('Idiomas a la par: ' + en.length + ' claves');
          "

      - name: Escribir version, download y manifest en module.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
            const { VERSION, TAG, PRERELEASE, GITHUB_REPOSITORY } = process.env;
            const base = 'https://github.com/' + GITHUB_REPOSITORY + '/releases';
            m.version = VERSION;
            m.download = base + '/download/' + TAG + '/' + m.id + '-' + TAG + '.zip';
            // Stable builds point at 'latest' so Foundry offers updates on its own
            // and the install URL never has to change. Prereleases are excluded
            // from 'latest' on purpose, so pointing them there would make Foundry
            // resolve a test build straight back to the last stable one.
            m.manifest =
              PRERELEASE === 'true'
                ? base + '/download/' + TAG + '/module.json'
                : base + '/latest/download/module.json';
            fs.writeFileSync('module.json', JSON.stringify(m, null, 2) + '\n');
            console.log('version  = ' + m.version);
            console.log('download = ' + m.download);
            console.log('manifest = ' + m.manifest);
          "

      - name: Armar el ZIP
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          MODULE_ID=$(node -p "require('./module.json').id")
          echo "MODULE_ID=$MODULE_ID" >> "$GITHUB_ENV"
          echo "ZIP=$MODULE_ID-$TAG.zip" >> "$GITHUB_ENV"
          # Se respeta la carpeta interna que ya usaban tus ZIPs anteriores
          mkdir -p "build/$MODULE_ID"
          cp -r module.json scripts styles templates lang "build/$MODULE_ID/"
          (cd build && zip -r "../$MODULE_ID-$TAG.zip" "$MODULE_ID")
          echo "--- contenido del ZIP ---"
          unzip -l "$MODULE_ID-$TAG.zip"

      - name: Publicar el release con sus dos archivos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          # GitHub excluye los prerelease al resolver "releases/latest", que es la
          # URL de actualizacion de las versiones estables: asi una prueba nunca se
          # le ofrece como actualizacion a los usuarios reales.
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
            echo "::notice::$TAG no es una version estable: se publica como prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe: se reemplazan los archivos"
            gh release upload "$TAG" module.json "$ZIP" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $FLAGS \
              module.json "$ZIP"
          fi

      # Canal de pruebas: una etiqueta fija cuyos archivos se reemplazan en cada
      # prerelease, para instalar siempre desde la misma URL. El release por
      # version sigue existiendo aparte, para poder volver a una rc concreta.
      - name: Actualizar el canal de pruebas
        if: steps.v.outputs.prerelease == 'true'
        # El canal de pruebas es una comodidad, no parte del release: si falla,
        # la version publicada arriba sigue siendo valida y el run no se marca
        # como fallido por esto.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # El log del workflow solo lo puede descargar quien tenga permisos de
          # admin en el repo. Este paso guarda su propia salida y la adjunta al
          # release para poder diagnosticarlo desde afuera.
          set +e
          {
          set -x
          # Ruta absoluta: el zip se arma desde dentro de build/ y gh lo busca
          # desde la raiz del workspace, asi que una ruta relativa depende de
          # quien mire y ya fallo una vez con "no matches found".
          DEV_ZIP="$GITHUB_WORKSPACE/$MODULE_ID-dev.zip"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
            const { GITHUB_REPOSITORY, GITHUB_RUN_NUMBER, VERSION } = process.env;
            const dev = 'https://github.com/' + GITHUB_REPOSITORY + '/releases/download/dev/';
            // Foundry compares versions segment by segment and falls back to a
            // string compare on anything non-numeric, so '0.7.0-rc10' reads as
            // older than '0.7.0-rc9' and the update stops being offered. The test
            // channel therefore reports a plain numeric build that always grows.
            m.version = VERSION.replace(/[-+].*\$/, '') + '.' + GITHUB_RUN_NUMBER;
            m.manifest = dev + 'module.json';
            m.download = dev + m.id + '-dev.zip';
            fs.writeFileSync('module.json', JSON.stringify(m, null, 2) + '\n');
            console.log('version  = ' + m.version);
            console.log('manifest = ' + m.manifest);
            console.log('download = ' + m.download);
          "
          cp module.json "build/$MODULE_ID/module.json"
          rm -f "$DEV_ZIP" "$GITHUB_WORKSPACE"/probe*.zip
          # zip venia comprimiendo los archivos correctamente y saliendo con 0,
          # pero dejando el resultado en otro lado, asi que la forma exacta de
          # invocarlo importa. En vez de apostar a una, se prueban las dos que
          # producen la estructura interna correcta y se usa la que exista.
          echo "--- zip disponible ---"
          which zip; zip -v 2>&1 | head -2
          echo "--- A: relativa desde build (la forma que usa el paso que funciona) ---"
          (cd build && zip -r "../probeA.zip" "$MODULE_ID"); echo "exitA=$?"
          echo "--- B: absoluta desde build (la que venia fallando) ---"
          (cd build && zip -r "$GITHUB_WORKSPACE/probeB.zip" "$MODULE_ID"); echo "exitB=$?"
          echo "--- que quedo en disco ---"
          ls -la "$GITHUB_WORKSPACE"/probe*.zip 2>&1
          for cand in probeA.zip probeB.zip; do
            if [ -s "$GITHUB_WORKSPACE/$cand" ]; then
              echo "se usa la variante $cand"
              mv "$GITHUB_WORKSPACE/$cand" "$DEV_ZIP"
              break
            fi
          done
          rm -f "$GITHUB_WORKSPACE"/probe*.zip
          if [ -s "$DEV_ZIP" ]; then
            echo "--- estructura interna del paquete elegido ---"
            unzip -l "$DEV_ZIP"
          else
            echo "NINGUNA VARIANTE PRODUJO ARCHIVO"
          fi
          NOTES="Canal de pruebas. Los archivos de este release se reemplazan en cada version de prueba, asi la URL de instalacion no cambia. Contenido actual: $TAG (version $VERSION). Para una version concreta, usa su propio release."
          if gh release view dev; then
            echo "El canal ya existe: se reemplazan sus archivos"
            gh release upload dev module.json "$DEV_ZIP" --clobber
            gh release edit dev --notes "$NOTES"
          else
            echo "Creando el canal por primera vez en $GITHUB_SHA"
            # --target explicito: la etiqueta "dev" no existe todavia y el
            # checkout de un tag deja el repo en HEAD desasociado, asi que se le
            # dice exactamente sobre que commit crearla.
            gh release create dev \
              --target "$GITHUB_SHA" \
              --title "Canal de pruebas" \
              --notes "$NOTES" \
              --prerelease \
              module.json "$DEV_ZIP"
          fi
          echo "Estado final del canal:"
          gh release view dev --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
          } > dev-channel.log 2>&1
          RC=$?
          echo "exit_code=$RC" >> dev-channel.log
          cat dev-channel.log
          gh release upload "$TAG" dev-channel.log --clobber || true
